services:
  watt_tipid_api:
    build:
      context: .

    container_name: wt_fastapi

    env_file:
      - .env

    expose:
      - "8000"

    depends_on:
      watt_tipid_redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]

      interval: 30s

      timeout: 10s

      retries: 5

      start_period: 20s

  watt_tipid_redis:
    image: redis:7-alpine

    container_name: wt_redis

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

      interval: 10s

      timeout: 5s

      retries: 5

  nginx:
    image: nginx:alpine

    container_name: wt_nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      watt_tipid_api:
        condition: service_healthy

volumes:
  redis-data:
