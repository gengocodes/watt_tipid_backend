services:
  watt_tipid_api:
    build:
      context: .

    env_file:
      - .env

    ports:
      - "8005:8080"

    depends_on:
      watt_tipid_redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  watt_tipid_redis:
    image: redis:7-alpine

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
